<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A75">
<title>Imtihon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: two columns on tablet/desktop (material + settings on the left, the test on the right); one stacked column on phones. Palette: Samarkand tile turquoise on cool paper, deep ink text. Type: Onest for text (has Cyrillic + Uzbek), JetBrains Mono for the A/B/C/D answer bubbles. */
:root{
  --bg:#EDF2F4; --surface:#FFFFFF; --field:#F6F9FA; --ink:#10212C; --muted:#52646F; --line:#D2DCE1;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D5EEEB;
  --bad:#A3231B; --bad-soft:#FBE6E4; --track:#B9C6CD; --thumb:#FFFFFF;
  --shadow:0 1px 2px rgba(16,33,44,.06),0 8px 22px rgba(16,33,44,.06);
  --font-ui:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D171E; --surface:#14222B; --field:#0F1B23; --ink:#E7EFF3; --muted:#93A5B0; --line:#26373F;
    --accent:#3FC5BC; --accent-ink:#06201E; --accent-soft:#12383A;
    --bad:#FF9B92; --bad-soft:#3A1B1A; --track:#3B4F5A; --thumb:#E7EFF3;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D171E; --surface:#14222B; --field:#0F1B23; --ink:#E7EFF3; --muted:#93A5B0; --line:#26373F;
  --accent:#3FC5BC; --accent-ink:#06201E; --accent-soft:#12383A;
  --bad:#FF9B92; --bad-soft:#3A1B1A; --track:#3B4F5A; --thumb:#E7EFF3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; padding-top:max(20px,env(safe-area-inset-top,0px)); padding-bottom:max(56px,calc(env(safe-area-inset-bottom,0px) + 24px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg); color:var(--ink);
  font:400 16px/1.5 var(--font-ui); -webkit-text-size-adjust:100%;
}
.shell{max-width:1120px;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;width:40px;height:40px;color:var(--accent)}
.brand h1{font-size:1.625rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand p{font-size:.875rem;color:var(--muted);margin-top:2px;max-width:46ch;text-wrap:balance}
.langs{display:flex;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.langs button{min-width:48px;min-height:38px;border:0;border-radius:9px;background:transparent;cursor:pointer;font:700 .8125rem var(--font-mono);color:var(--muted);letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* layout */
.layout{display:grid;gap:20px}
.left{display:grid;gap:16px;min-width:0}
.right{min-width:0}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(340px,420px) minmax(0,1fr);align-items:start;gap:24px}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel h2,.res-title{display:flex;align-items:center;gap:10px;font-size:1.0625rem;font-weight:700;letter-spacing:-.005em}
.step{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 .8125rem var(--font-mono)}
.panel h2{margin-bottom:14px}

textarea{
  display:block;width:100%;min-height:250px;resize:vertical;padding:14px;
  border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);
  font:400 1rem/1.55 var(--font-ui);
}
textarea::placeholder{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px;font-size:.8125rem;color:var(--muted)}
.meta .mono{font-family:var(--font-mono)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.warn{color:var(--bad);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);
  font:600 .9375rem var(--font-ui);cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.primary{width:100%;min-height:54px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.0625rem;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{min-height:40px;padding:0 14px;font-size:.875rem}
.btn.quiet{background:transparent}
.btn svg{width:18px;height:18px;flex:none}
.status{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-weight:600;font-size:.9375rem}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.fields{display:grid;gap:18px}
.lbl{display:block;font-size:.875rem;font-weight:600;margin-bottom:8px}
.inline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.inline .lbl{margin:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--field);overflow:hidden}
.stepper button{width:48px;height:46px;border:0;background:transparent;font:500 1.375rem var(--font-mono);cursor:pointer;color:var(--ink)}
.stepper button:hover{background:var(--accent-soft)}
.stepper output{min-width:56px;text-align:center;font:700 1.125rem var(--font-mono)}

.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--field);gap:2px}
.seg label{position:relative;flex:1;min-width:0;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-height:44px;padding:4px 8px;border-radius:9px;text-align:center;font-size:.9375rem;font-weight:600;color:var(--muted);line-height:1.2}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
select{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:500 1rem var(--font-ui)}

/* results */
.res-tools{margin-bottom:14px}
.res-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}
.count{font:700 .8125rem var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:640px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.track{flex:none;width:46px;height:27px;border-radius:14px;background:var(--track);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--thumb);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(19px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}

#out{display:grid;gap:14px}
.notice{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:.9375rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.q-head{display:flex;align-items:flex-start;gap:12px}
.qn{flex:none;min-width:28px;font:700 1rem var(--font-mono);color:var(--accent);padding-top:1px}
.qt{flex:1;min-width:0;font-size:1.0625rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.rm{flex:none;width:40px;height:40px;margin:-6px -8px 0 0;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.rm:hover{background:var(--bad-soft);color:var(--bad)}
.rm svg{width:18px;height:18px}
.opts{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.bub{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);font:700 .8125rem var(--font-mono);color:var(--muted)}
.ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.is-key{background:var(--accent-soft);border-color:var(--accent)}
.opt.is-key .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ok{flex:none;display:grid;place-items:center;color:var(--accent)}
.ok svg{width:20px;height:20px}
.src{margin-top:12px;font-size:.8125rem;color:var(--muted)}
.src span{font-weight:700;margin-right:4px}

.key{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.key h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.key ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.key li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font:500 .9375rem var(--font-mono)}
.key li span{color:var(--muted)}
.key li b{color:var(--accent);font-weight:700}
.review{font-size:.875rem;color:var(--muted);padding:2px 4px}

.empty{display:grid;justify-items:center;gap:14px;text-align:center;padding:36px 20px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty svg{width:120px;height:auto;color:var(--accent)}
.empty p{max-width:34ch;text-wrap:balance}

.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.bar{height:14px;border-radius:7px;background:var(--line);animation:pulse 1.4s ease-in-out infinite}
.bar.w1{width:78%}.bar.w2{width:54%}.bar.opt-bar{height:46px;border-radius:12px}
@keyframes pulse{50%{opacity:.45}}
.loading-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-weight:600}
.loading-bar .msg{display:flex;align-items:center;gap:10px;min-width:0}

.actions .tg{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions .tg:hover{filter:brightness(1.06)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}
.foot .btn{color:var(--accent);font-weight:700;text-decoration:none}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9375rem;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;max-width:calc(100% - 32px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .spin,.bar{animation:none}
  .toast,.track,.track::after{transition:none}
}
#printArea{display:none}
.openbar{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--fg);font-size:.9375rem;display:flex;flex-direction:column;gap:10px}
.openbar b{font-weight:700}
.openbar .row{display:flex;gap:8px;flex-wrap:wrap}
@media print{
  body{background:#fff!important}
  .shell,.toast{display:none!important}
  #printArea{display:block;color:#000;font:14pt/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #printArea h1{font-size:18pt;margin:0 0 14pt}
  #printArea .pq{margin:0 0 12pt;break-inside:avoid;white-space:pre-wrap}
  #printArea .po{margin-left:18pt}
  #printArea .key{break-before:page}
}
</style>
</head>
<body>
<div class="shell">
  <div class="openbar" id="openbar" hidden></div>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="8" y="8" width="24" height="24" rx="2" stroke="currentColor" stroke-width="2.4"/>
        <rect x="8" y="8" width="24" height="24" rx="2" stroke="currentColor" stroke-width="2.4" transform="rotate(45 20 20)"/>
        <circle cx="20" cy="20" r="3.6" fill="currentColor"/>
      </svg>
      <div>
        <h1>Imtihon</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="uz" aria-label="Oʻzbekcha">UZ</button>
      <button type="button" data-lang="ru" aria-label="Русский">RU</button>
      <button type="button" data-lang="en" aria-label="English">EN</button>
    </div>
  </header>

  <main class="layout">
    <div class="left">
      <section class="panel" aria-labelledby="h-material">
        <h2 id="h-material"><span class="step">1</span><span data-i18n="s1"></span></h2>
        <textarea id="material" spellcheck="false" aria-labelledby="h-material" data-i18n-ph="placeholder"></textarea>
        <div class="meta">
          <span id="chars" class="mono"></span>
          <span id="exBadge" class="badge" data-i18n="exampleBadge"></span>
          <span id="photoBadge" class="badge" data-i18n="photoBadge" hidden></span>
          <span id="over" class="warn" hidden></span>
        </div>
        <div class="row">
          <label class="btn small" for="file" id="uploadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
            <span data-i18n="upload"></span>
          </label>
          <input id="file" type="file" accept=".txt,.md,.csv,text/plain" multiple hidden>
          <label class="btn small" for="photo" id="photoBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.5-2h6l1.5 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <span data-i18n="photo"></span>
          </label>
          <input id="photo" type="file" accept="image/*" multiple hidden>
          <label class="btn small" for="pdfFile" id="pdfInBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
            <span data-i18n="pdfIn"></span>
          </label>
          <input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
          <button type="button" class="btn small quiet" id="clear" data-i18n="clear"></button>
          <button type="button" class="btn small quiet" id="example" data-i18n="loadExample"></button>
        </div>
        <div class="status" id="photoStatus" hidden>
          <span class="spin"></span>
          <span id="photoText" style="flex:1;min-width:0"></span>
          <button type="button" class="btn small" id="photoStop" data-i18n="cancel"></button>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-settings">
        <h2 id="h-settings"><span class="step">2</span><span data-i18n="s2"></span></h2>
        <div class="fields">
          <div class="inline">
            <span class="lbl" id="l-count" data-i18n="questions"></span>
            <div class="stepper" role="group" aria-labelledby="l-count">
              <button type="button" id="dec" data-i18n-aria="dec">−</button>
              <output id="countOut" aria-live="polite">10</output>
              <button type="button" id="inc" data-i18n-aria="inc">+</button>
            </div>
          </div>
          <div>
            <span class="lbl" id="l-focus" data-i18n="focus"></span>
            <div class="seg" role="radiogroup" aria-labelledby="l-focus">
              <label><input type="radio" name="focus" id="focus-key" value="key" checked><span data-i18n="focusKey"></span></label>
              <label><input type="radio" name="focus" id="focus-random" value="random"><span data-i18n="focusRandom"></span></label>
            </div>
          </div>
          <div>
            <span class="lbl" id="l-qtype" data-i18n="qtype"></span>
            <div class="seg" role="radiogroup" aria-labelledby="l-qtype">
              <label><input type="radio" name="qtype" id="qtype-mcq" value="mcq" checked><span data-i18n="qMcq"></span></label>
              <label><input type="radio" name="qtype" id="qtype-tf" value="tf"><span data-i18n="qTf"></span></label>
              <label><input type="radio" name="qtype" id="qtype-mixed" value="mixed"><span data-i18n="qMixed"></span></label>
            </div>
          </div>
          <div>
            <span class="lbl" id="l-level" data-i18n="level"></span>
            <div class="seg" role="radiogroup" aria-labelledby="l-level">
              <label><input type="radio" name="level" id="level-easy" value="easy"><span data-i18n="easy"></span></label>
              <label><input type="radio" name="level" id="level-mixed" value="mixed" checked><span data-i18n="mixed"></span></label>
              <label><input type="radio" name="level" id="level-hard" value="hard"><span data-i18n="hard"></span></label>
            </div>
          </div>
          <div>
            <label class="lbl" for="outLang" data-i18n="outLang"></label>
            <select id="outLang">
              <option value="same" data-i18n="same"></option>
              <option value="uz">Oʻzbekcha</option>
              <option value="ru">Русский</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-top:20px">
          <button type="button" class="btn primary" id="gen"><span id="genLabel"></span></button>
        </div>
      </section>
    </div>

    <section class="right" aria-labelledby="h-results">
      <div class="res-tools" id="tools" hidden>
        <div class="res-top">
          <h2 class="res-title" id="h-results"><span class="step">3</span><span data-i18n="results"></span><span class="count" id="qcount"></span></h2>
          <label class="switch"><input type="checkbox" id="showKey"><span class="track"></span><span data-i18n="showAnswers"></span></label>
        </div>
        <div class="actions">
          <button type="button" class="btn small" id="copyTest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
            <span data-i18n="copyTest"></span>
          </button>
          <button type="button" class="btn small" id="copyKey">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
            <span data-i18n="copyKey"></span>
          </button>
          <button type="button" class="btn small" id="save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
            <span data-i18n="save"></span>
          </button>
          <button type="button" class="btn small" id="pdf">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>

/* One call to our own serverless function. The Gemini key lives only on the server. */
async function callApi(body,signal){
  var res;
  try{
    res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:signal});
  }catch(e){
    if(e&&e.name==='AbortError') throw {code:'cancelled'};
    throw {code:'network'};
  }
  var data=null;
  try{data=await res.json()}catch(e){}
  if(res.ok&&data) return data;
  var code=res.status===429?'rate_limited':(res.status===503||res.status===504)?'busy':res.status===413?'too_large':'failed';
  throw {code:code};
}

      var tl=cleanOption(it.trueLabel)||'True',fl=cleanOption(it.falseLabel)||'False';
      if(!q||tl.toLowerCase()===fl.toLowerCase()) return;
      var tk=q.toLowerCase();if(seen[tk]) return;seen[tk]=1;
      out.push({tf:true,q:q,opts:[tl,fl],ans:it.truth?0:1,note:typeof it.note==='string'?it.note.trim():''});
      return;
    }
    var correct=cleanOption(it.correct);
    var wrongRaw=Array.isArray(it.wrong)?it.wrong:[];
    if(!q||!correct) return;
    var used={};used[correct.toLowerCase()]=1;
    var w=[];
    wrongRaw.forEach(function(x){
      var s=cleanOption(x);if(!s)return;
      var k=s.toLowerCase();
      if(!used[k]&&w.length<3){used[k]=1;w.push(s)}
    });
    if(w.length<3) return;
    var qk=q.toLowerCase();if(seen[qk]) return;seen[qk]=1;
    out.push({q:q,correct:correct,wrong:w,note:typeof it.note==='string'?it.note.trim():''});
  });
  return out.slice(0,state.count);
}
/* spread the correct answers evenly over A, B, C, D */
function place(items){
  var nm=items.filter(function(it){return !it.tf}).length,slots=[];
  for(var i=0;i<nm;i++)slots.push(i%4);
  slots=shuffle(slots);
  var si=0;
  return items.map(function(it){
    if(it.tf) return {q:it.q,opts:it.opts.slice(),ans:it.ans,note:it.note,tf:true};
    var opts=shuffle(it.wrong),pos=slots[si++];
    opts.splice(pos,0,it.correct);
    return {q:it.q,opts:opts,ans:pos,note:it.note};
  });
}

async function generate(){
  if(state.busy) return;
  var L=T[lang];
  var text=els.material.value.trim();
  hideNotice();
  if(text.length<MIN_CHARS){showNotice(L.tooShort);return}
  if(text.length>MAX_CHARS) text=text.slice(0,MAX_CHARS);
  var prevView=state.questions.length?'list':'empty';
  state.busy=true;els.gen.disabled=true;state.view='loading';
  updateGenLabel();renderOut();startTicker();
  ctl=new AbortController();
  try{
    var data=await callApi({action:'test',text:text,count:state.count,focus:state.focus,level:state.level,qtype:state.qtype,outLang:state.outLang},ctl.signal);
    var raw=data.questions;
    var items=cleanItems(raw);
    if(!items.length){state.view=prevView;showNotice(L.failed);return}
    state.questions=place(items);
    state.fewer=items.length<state.count?items.length:0;
    state.showKey=false;els.showKey.checked=false;state.view='list';
  }catch(e){
    state.view=prevView;
    var code=e&&e.code;
    if(code==='cancelled'){/* stopped by the teacher */}
    else if(code==='rate_limited'){showNotice(L.rate)}
    else if(code==='busy'){showNotice(L.busy)}
    else if(code==='network'){showNotice(L.network)}
    else{showNotice(L.failed)}
  }finally{
    stopTicker();state.busy=false;ctl=null;
    els.gen.disabled=false;
    updateGenLabel();renderOut();
    if(state.view==='list'&&window.matchMedia&&window.matchMedia('(max-width:899px)').matches){
      try{els.out.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}
    }
  }
}

  var L=T[lang],s=L.header+'\n\n';
  state.questions.forEach(function(q,i){
    s+=(i+1)+'. '+q.q+'\n';
    q.opts.forEach(function(o,j){s+='   '+LETTERS[j]+') '+o+'\n'});
    s+='\n';
  });
  return s.trim()+'\n';
}
function keyText(){
  var L=T[lang];
  return L.answerKey+': '+state.questions.map(function(q,i){return (i+1)+'-'+LETTERS[q.ans]}).join(', ')+'\n';
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=document.execCommand('copy');document.body.removeChild(ta);return ok;
  }catch(e){return false}
}

    return {q:q.q,correct:q.opts[q.ans],wrong:q.opts.filter(function(_,j){return j!==q.ans}),note:q.note};
  });

/* ---------- photos of book pages ---------- */
function showPhotoStatus(done,total){
  els.photoStatus.hidden=false;
  els.photoText.textContent=T[lang].readingPhotos(done,total);
}
/* Shrink each photo to about 1600 px so the request stays small and fast. */
function fileToJpeg(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,1600/Math.max(w,h));
      var c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject({code:'image_rejected'})};
    img.src=url;
  });
}
els.photoStop.addEventListener('click',function(){if(photoCtl)photoCtl.abort()});
els.photo.addEventListener('change',async function(){
  var all=Array.prototype.slice.call(els.photo.files||[]);
  els.photo.value='';
  if(!all.length||state.photoBusy) return;
  var L=T[lang];
  hideNotice();
  var files=all.filter(function(f){return /^image\//.test(f.type)}).slice(0,MAX_PHOTOS);
  if(!files.length){showNotice(L.photoType);return}
  state.photoBusy=true;els.photo.disabled=true;
  photoCtl=new AbortController();
  var batches=[];
  for(var i=0;i<files.length;i+=PHOTOS_PER_CALL) batches.push(files.slice(i,i+PHOTOS_PER_CALL));
  var done=0,texts=[],cut=false;
  showPhotoStatus(done,files.length);
  try{
    for(var b=0;b<batches.length;b++){
      var imgs=[];
      for(var k=0;k<batches[b].length;k++){
        imgs.push({mime:'image/jpeg',data:await fileToJpeg(batches[b][k])});
      }
      var data=await callApi({action:'ocr',images:imgs},photoCtl.signal);
      var t=(data.text||'').trim();
      if(t) texts.push(t);
      if(data.truncated) cut=true;
      done+=batches[b].length;showPhotoStatus(done,files.length);
    }
    var text=texts.join('\n\n').trim();
    if(!text||text==='[unreadable]'){showNotice(L.photoNone)}
    else{
      var cur=els.material.value.trim();
      els.material.value=(state.isExample||!cur)?text:cur+'\n\n'+text;
      els.material.scrollTop=0;
      state.isExample=false;state.fromPhoto=true;
      store('imtihon-material',els.material.value);updateMeta();
      if(cut) showNotice(L.photoCut);
    }
  }catch(e){
    var code=e&&e.code;
    if(code==='cancelled'){/* stopped */}
    else if(code==='image_rejected'||code==='too_large'){showNotice(L.photoRejected)}
    else if(code==='rate_limited'){showNotice(L.rate)}
    else if(code==='busy'){showNotice(L.busy)}
    else if(code==='network'){showNotice(L.network)}
    else{showNotice(L.failed)}
  }finally{
    state.photoBusy=false;els.photo.disabled=false;photoCtl=null;
    els.photoStatus.hidden=true;
  }
});

/* ---------- PDF of a lesson ---------- */
var MAX_PDF_BYTES=2600000;
function fileToBase64(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){resolve(String(r.result).split(',')[1]||'')};
    r.onerror=function(){reject({code:'failed'})};
    r.readAsDataURL(file);
  });
}
$('#pdfFile').addEventListener('change',async function(){
  var input=$('#pdfFile'),f=input.files&&input.files[0];
  input.value='';
  if(!f||state.photoBusy) return;
  var L=T[lang];
  hideNotice();
  if(f.size>MAX_PDF_BYTES){showNotice(L.pdfBig);return}
  state.photoBusy=true;input.disabled=true;els.photo.disabled=true;
  photoCtl=new AbortController();
  els.photoStatus.hidden=false;els.photoText.textContent=L.readingPdf;
  try{
    var b64=await fileToBase64(f);
    var data=await callApi({action:'pdf',data:b64},photoCtl.signal);
    var text=(data.text||'').trim();
    if(!text||text==='[unreadable]'){showNotice(L.pdfBad)}
    else{
      var cur=els.material.value.trim();
      els.material.value=(state.isExample||!cur)?text:cur+'\n\n'+text;
      els.material.scrollTop=0;
      state.isExample=false;state.fromPhoto=true;
      store('imtihon-material',els.material.value);updateMeta();
      if(data.truncated) showNotice(L.photoCut);
    }
  }catch(e){
    var code=e&&e.code;
    if(code==='cancelled'){/* stopped */}
    else if(code==='too_large'){showNotice(L.pdfBig)}
    else if(code==='rate_limited'){showNotice(L.rate)}
    else if(code==='busy'){showNotice(L.busy)}
    else if(code==='network'){showNotice(L.network)}
    else{showNotice(L.pdfBad)}
  }finally{
    state.photoBusy=false;input.disabled=false;els.photo.disabled=false;photoCtl=null;
    els.photoStatus.hidden=true;
  }
});

  applyLang();
})();
})();
